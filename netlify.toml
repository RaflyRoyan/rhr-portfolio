[build]
  # Chromium Playwright dibutuhkan untuk merender diagram Mermaid saat build
  command = "npx playwright install chromium && npm run build"
  publish = "dist"

[build.environment]
  # Samakan dengan .node-version (astro dipin ke 7.3.8 agar kompatibel Node 22.21)
  NODE_VERSION = "22.21.0"

# Aset hasil build Astro ber-hash, aman di-cache selamanya
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
